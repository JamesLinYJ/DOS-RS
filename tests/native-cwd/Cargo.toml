[package]
name = "dosrs-cwd-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "cwdprobe"
crate-type = ["staticlib"]

[dependencies]
dosrs_user = { path = "../../userland/rust", features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
