[package]
name = "dos"
version = "0.0.0"
edition = "2024"

[features]
batch-console = []
kernel-selftest = []
native-gate-test = []
pc386 = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[target.'cfg(target_pointer_width = "16")'.dependencies]
dosrs-realmode = { path = "boot/realmode" }

[target.'cfg(not(target_pointer_width = "16"))'.dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
uefi = { version = "0.38", default-features = false }
x86 = { version = "0.52.0", default-features = false }

linked_list_allocator = "0.10.5"
dosrs-native-posix = { path = "native-posix" }
dosrs-btrfs = { path = "vendor/btrfs" }
dosrs-block = { path = "storage/block" }
dosrs-ntfs = { path = "storage/ntfs" }
dosrs-native-exec = { path = "native-exec" }
